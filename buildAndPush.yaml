parameters:
  - name: acrName
    type: string
  - name: hubServiceConnection
    type: string
  - name: repositoryName
    type: string
  - name: imageTag
    type: string
  - name: dockerfilePath
    type: string
  - name: buildContext
    type: string
  - name: enableTrivyScan
    type: boolean
    default: false
  - name: trivySkipFiles
    type: string
    default: '**/node_modules/**,**/.git/**,**/dist/**,**/build/**,**/*.min.js,**/*.bundle.js,**/*.map,**/*.log,**/*.cache'
  - name: trivyFilesystemTarget
    type: string
    default: '.'
  - name: trivyVersion
    type: string
    default: 'latest'
  - name: trivyScanners
    type: string
    default: 'misconfig,vuln,secret'
  - name: trivySeverities
    type: string
    default: 'LOW, MEDIUM, HIGH, CRITICAL'
  - name: trivyIgnoreUnfixed
    type: boolean
    default: true
  - name: trivyContinueOnError
    type: boolean
    default: true

jobs:
  - job: Build
    displayName: 'Build and Security Scan'
    steps:
      - ${{ if eq(parameters.enableTrivyScan, true) }}:
        - task: trivy@2
          continueOnError: ${{ parameters.trivyContinueOnError }}
          displayName: 'Filesystem Scan'
          inputs:
            version: '${{ parameters.trivyVersion }}'
            type: 'filesystem'
            target: '${{ parameters.trivyFilesystemTarget }}'
            scanners: '${{ parameters.trivyScanners }}'
            ignoreUnfixed: ${{ parameters.trivyIgnoreUnfixed }}
            ignoreScanErrors: true
            reports: 'github, html, junit'
            publish: true
            severities: '${{ parameters.trivySeverities }}'
            skipFiles: '${{ parameters.trivySkipFiles }}'

      - task: AzureCLI@2
        displayName: Login to ACR
        inputs:
          azureSubscription: '${{ parameters.hubServiceConnection }}'
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            ACR_SERVER=$(az acr show -n ${{ parameters.acrName }} --query loginServer -o tsv)
            echo "##vso[task.setvariable variable=acrLoginServer]$ACR_SERVER"
            TOKEN=$(az acr login -n ${{ parameters.acrName }} --expose-token --query accessToken -o tsv)
            echo "$TOKEN" | sudo docker login "$ACR_SERVER" -u 00000000-0000-0000-0000-000000000000 --password-stdin

      - task: Bash@3
        displayName: Build and push image
        inputs:
          targetType: inline
          script: |
            set -e
            IMAGE="$(acrLoginServer)/${{ parameters.repositoryName }}:${{ parameters.imageTag }}"
            sudo docker build --no-cache --platform linux/amd64 -t "$IMAGE" -f ${{ parameters.dockerfilePath }} ${{ parameters.buildContext }}
            sudo docker push "$IMAGE"

      - ${{ if eq(parameters.enableTrivyScan, true) }}:
        - task: trivy@2
          continueOnError: ${{ parameters.trivyContinueOnError }}
          displayName: 'Container Image Scan'
          inputs:
            method: 'system'
            type: 'image'
            target: '$(acrLoginServer)/${{ parameters.repositoryName }}:${{ parameters.imageTag }}'
            scanners: '${{ parameters.trivyScanners }}'
            severities: '${{ parameters.trivySeverities }}'
            ignoreUnfixed: ${{ parameters.trivyIgnoreUnfixed }}
            skipFiles: '${{ parameters.trivySkipFiles }}'
